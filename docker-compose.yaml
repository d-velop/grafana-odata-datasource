services:
  grafana:
    extends:
      file: .config/docker-compose-base.yaml
      service: grafana
    depends_on:
      test-server:
        condition: service_healthy
  test-server:
    build: test-server
    ports:
      - "4004:4004"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "-o", "/dev/null", "http://localhost:4004/odata/v4/test/$$metadata"]
      interval: 5s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 2s
